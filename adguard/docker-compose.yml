services:
  adguardhome:
    image: adguard/adguardhome
    container_name: adguard
    restart: unless-stopped
    labels:
      - wud.watch=true
      - homepage.group=Network
      - homepage.name=AdGuard
      - homepage.icon=adguard-home.png
      - homepage.href=https://adguard.bullman.net
      - homepage.description=AdGuard Home
      - homepage.widget.type=adguard
      - homepage.widget.url=http://192.168.0.250:400
      - homepage.widget.fields=["queries", "blocked", "filtered", "latency"]
      - homepage.widget.username=${ADGUARD_USERNAME:?Set ADGUARD_USERNAME in Portainer}
      - homepage.widget.password=${ADGUARD_PASSWORD:?Set ADGUARD_PASSWORD in Portainer}
    network_mode: host # Use host networking for easy DNS setup
    volumes:
      - /Volume1/public/docker-configs/adguard:/opt/adguardhome/conf # Store data persistently
    healthcheck:
      # adguard does not have CURL. use wget instead
      test: wget --spider -S -q http://localhost:400/assets/favicon.png
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    ports:
      # AdGuard Home Admin Panel as well as DNS-over-HTTPS
      - 81:80/tcp
      - 443:443/tcp
      - 443:443/udp
      - 3000:3000/tcp # For accessing the web interface
