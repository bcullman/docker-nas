services:
  suggestarr:
    image: ciuse99/suggestarr:latest
    container_name: suggestarr
    restart: unless-stopped
    labels:
      - wud.watch=true
      - homepage.group=Acquisition
      - homepage.name=SuggestArr
      - homepage.href=https://suggestarr.bullman.net
      - homepage.description=Automated Media Recommendations
    volumes:
      - /Volume1/public/docker-configs/suggestarr:/app/config/config_files
    environment:
      - TZ=America/Los_Angeles
      - SUGGESTARR_PORT=5000
      - LOG_LEVEL=INFO
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/health/live')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    ports:
      - 5000:5000
