services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflare-tunnel
    restart: unless-stopped
    labels:
      - wud.watch=true
      - homepage.group=Network
      - homepage.name=Cloudflare Tunnel
      - homepage.icon=cloudflare.png
      - homepage.description=Cloudflare Tunnel
      - homepage.widget.type=cloudflared
      - homepage.widget.accountid=${CLOUDFLARE_ACCOUNT_ID:?Set CLOUDFLARE_ACCOUNT_ID in Portainer} # from zero trust dashboard url e.g. https://one.dash.cloudflare.com/<accountid>/home/quick-start
      - homepage.widget.tunnelid=${CLOUDFLARE_TUNNEL_ID:?Set CLOUDFLARE_TUNNEL_ID in Portainer} # found in tunnels dashboard under the tunnel name
      - homepage.widget.key=${CLOUDFLARE_HOMEPAGE_API_TOKEN:?Set CLOUDFLARE_HOMEPAGE_API_TOKEN in Portainer}
    environment:
      - TUNNEL_METRICS=0.0.0.0:60123
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "localhost:60123", "ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token
      - ${CLOUDFLARE_TUNNEL_TOKEN:?Set CLOUDFLARE_TUNNEL_TOKEN in Portainer}
