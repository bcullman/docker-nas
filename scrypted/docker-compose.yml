services:
  scrypted:
    image: ghcr.io/koush/scrypted:latest
    container_name: scrypted
    restart: unless-stopped
    labels:
      - wud.watch=true
      - homepage.group=Utilities
      - homepage.name=Scrypted
      - homepage.icon=scrypted.png
      - homepage.href=https://scrypted.bullman.net
      - homepage.description=Camera and smart-home integration
    network_mode: host
    volumes:
      - /Volume1/public/docker-configs/scrypted:/server/volume
    environment:
      - TZ=America/Los_Angeles
    healthcheck:
      test: curl --insecure --connect-timeout 15 --silent --show-error --fail https://localhost:10443/
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    devices:
      - /dev/dri:/dev/dri
    logging:
      driver: none
