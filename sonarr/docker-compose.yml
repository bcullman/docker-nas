services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: on-failure
    labels:
      - wud.watch=true
      - homepage.group=Acquisition
      - homepage.name=Sonarr
      - homepage.icon=sonarr.png
      - homepage.href=https://sonarr.bullman.net
      - homepage.description=TV Series Management
      - homepage.widget.type=sonarr
      - homepage.widget.url=http://192.168.0.250:8989
      - homepage.widget.fields=["wanted","queued", "series"]
      - homepage.widget.key=${SONARR_API_KEY:?Set SONARR_API_KEY in Portainer}
    network_mode: container:vpn
    volumes:
      - /Volume1/public/docker-configs/sonarr/:/config
      - /Volume2/media:/media
    environment:
      - TZ=America/Los_Angeles
      - PUID=0
      - PGID=0
    healthcheck:
      test: curl --silent --fail http://localhost:8989/ping
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
