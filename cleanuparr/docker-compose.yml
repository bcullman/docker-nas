services:
  cleanuparr:
    image: ghcr.io/cleanuparr/cleanuparr:latest
    container_name: cleanuparr
    restart: on-failure
    labels:
      - wud.watch=true
      - homepage.group=Acquisition
      - homepage.name=Cleanuparr
      - homepage.icon=cleanuparr.png
      - homepage.href=https://cleanuparr.bullman.net
      - homepage.description=Download Queue Cleanup
    network_mode: container:vpn
    volumes:
      - /Volume1/public/docker-configs/cleanuparr:/config
    environment:
      - TZ=America/Los_Angeles
      - PUID=0
      - PGID=0
      - PORT=11011
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:11011/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
#    ports:
#      - 11011:11011
